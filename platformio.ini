[env:m5dial]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
lib_deps =
  m5stack/M5Dial@^1.0.3
  bblanchon/ArduinoJson@^7.0.0
  tzapu/WiFiManager@^2.0.17

; Upload via Wi-Fi (needs OTA_PASSWORD in include/secrets.h):
;   AIRDIAL_OTA_PASSWORD=... pio run -e m5dial-ota -t upload
[env:m5dial-ota]
extends = env:m5dial
upload_protocol = espota
upload_port = meulab-airdial.local
upload_flags = --auth=${sysenv.AIRDIAL_OTA_PASSWORD}
