; Desktop simulator: compiles ../src/main.cpp natively (M5GFX + SDL2) with
; Arduino/WiFi/FreeRTOS shims. See README.md.
;   macOS: brew install sdl2      Linux: apt install libsdl2-dev
;   pio run -e sim && .pio/build/sim/program fixtures/aircraft.json out
;   pio run -e sim-live && .pio/build/sim-live/program fixtures/aircraft.json
; SDL2 flags come from sdl2-config (Homebrew and apt both ship it).
[sim_common]
platform = native
build_flags = -std=c++17 -O1
  !echo "$(sdl2-config --cflags) -L$(sdl2-config --prefix)/lib -lSDL2"
  -Ishim -I../include -I../src
  -Wno-deprecated-declarations
lib_deps =
  m5stack/M5GFX@^0.3.0
  bblanchon/ArduinoJson@^7.0.0

; Headless: renders UI scenarios to PNG. Baseline/CI build: no airline logos
; (include/airline_logos.h is not committed, so CI never has it).
[env:sim]
extends = sim_common
build_src_filter = +<sim.cpp>
build_flags = ${sim_common.build_flags}
  -DNO_AIRLINE_LOGOS

; Headless with airline logos, if include/airline_logos.h exists locally.
[env:sim-full]
extends = sim_common
build_src_filter = +<sim.cpp>

; Interactive: SDL window running the real setup()/loop().
[env:sim-live]
extends = sim_common
build_src_filter = +<interactive.cpp>
build_flags = ${sim_common.build_flags}
  -DM5GFX_BOARD=board_M5Dial
  -DM5GFX_SCALE=2
  -DM5GFX_SHOW_FRAME
  -DM5GFX_BACK_COLOR=0x222222u
